<div class="message-dialog-container" [ngClass]="data.type || 'info'">
  <div class="message-header">
    <div class="icon-wrapper">
      <mat-icon>{{ data.icon || (data.type === 'error' ? 'error_outline' : 'info_outline') }}</mat-icon>
    </div>
    <h2 mat-dialog-title>{{ data.title }}</h2>
  </div>

  <div mat-dialog-content class="message-content">
    <p>{{ data.message }}</p>
  </div>

  <div mat-dialog-actions class="message-actions">
    <button mat-button class="btn-primary-gradient" (click)="close()">
      {{ data.confirmLabel || 'OKAY' }}
    </button>
  </div>
</div>
